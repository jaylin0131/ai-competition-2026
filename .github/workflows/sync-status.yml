name: 同步網頁勾選到 tasks.csv

# 每天台灣時間 23:00 執行；也可在 Actions 頁面按「Run workflow」手動執行。
# 每天讀一次 Supabase，也順便避免免費專案因 7 天沒存取而暫停。
on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-status
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Taipei
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 讀取網站勾選並更新 tasks.csv
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python site/sync_status.py

      - name: 有變更就 commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add JNC-AIoT/schedule QKD-Eavesdrop-AI/schedule
          if git diff --cached --quiet; then
            echo "沒有變更"
          else
            git commit -m "chore: 同步網頁勾選狀態到 tasks.csv"
            git push
          fi
