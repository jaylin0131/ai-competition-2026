name: 網站規劃同步到 tasks.csv

# 網站上的規劃是唯一來源。每天台灣時間 23:00 把它寫回兩個專案的 tasks.csv 並重產甘特圖；
# 也可在 Actions 頁面按「Run workflow」立即同步。每天讀一次 Supabase 也能避免免費專案暫停。
on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tasks-db
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Taipei
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 網站規劃寫回 tasks.csv
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python site/tasks_db.py export

      - name: 有變更就 commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add JNC-AIoT/schedule QKD-Eavesdrop-AI/schedule
          if git diff --cached --quiet; then
            echo "沒有變更"
          else
            git commit -m "chore: 網站規劃同步到 tasks.csv"
            git push
          fi
